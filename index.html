<script>

const SUPABASE_URL = "vqcsxozodlduvzwqumoz";
const SUPABASE_KEY = "sb_publishable_w8FhItbY8LzQdwXfK74hAQ_eO2mYDaY";

async function searchPart() {

  const part = document.getElementById("partNumber").value.trim();
  const result = document.getElementById("result");

  if (!part) {
    alert("Please enter a part number");
    return;
  }

  result.innerHTML =
    "<div class='result'><p>Searching...</p></div>";

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/BRANCH%20STOCK?Itemcode=eq." +
      encodeURIComponent(part) +
      "&select=Itemcode,ItemName,Branch,quantity";

    const response = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText);
    }

    const data = await response.json();

    if (data.length === 0) {
      result.innerHTML =
        "<div class='result'>" +
        "<h2>Part Not Found</h2>" +
        "<p>No stock found for <b>" + part + "</b></p>" +
        "</div>";
      return;
    }

    let total = 0;

    data.forEach(row => {
      total += Number(row.quantity) || 0;
    });

    let rows = "";

    data.forEach(row => {
      rows +=
        "<tr>" +
        "<td>" + row.Branch + "</td>" +
        "<td>" + row.quantity + "</td>" +
        "</tr>";
    });

    result.innerHTML =
      "<div class='result'>" +
      "<h2>" + data[0].Itemcode + "</h2>" +
      "<p><b>" + data[0].ItemName + "</b></p>" +
      "<div class='total'>TOTAL STOCK: " + total + "</div>" +
      "<table>" +
      "<tr><th>Branch</th><th>Stock</th></tr>" +
      rows +
      "</table>" +
      "</div>";

  } catch (error) {

    result.innerHTML =
      "<div class='result'>" +
      "<h2>Error</h2>" +
      "<p>" + error.message + "</p>" +
      "</div>";

  }

}

</script>
</html>
