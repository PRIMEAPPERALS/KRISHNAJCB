<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krishna parts</title>
  <link rel="icon" type="image/png" href="./ChatGPT%20Image%20Sep%2015,%202026,%2012_14_03%20PM.png">
  <link rel="apple-touch-icon" href="./ChatGPT%20Image%20Sep%2015,%202026,%2012_14_03%20PM.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .search-box,
    .result {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .result {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 10px 5px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    th {
      font-weight: bold;
      font-size: 14px;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 25%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 12%;
      text-align: center;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 17%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 13%;
      text-align: center;
    }

    th:nth-child(5),
    td:nth-child(5) {
      width: 33%;
      text-align: center;
    }

    .movement-badge {
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.15;
      font-weight: bold;
      text-align: center;
      white-space: normal;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .search-box,
      .result {
        padding: 14px;
        border-radius: 12px;
      }

      .total {
        font-size: 17px;
        gap: 8px;
      }

      th,
      td {
        padding: 9px 4px;
        font-size: 13px;
      }

      th {
        font-size: 12px;
      }

      .movement-badge {
        font-size: 10px;
        padding: 5px 4px;
      }
    }

    .error {
      color: red;
    }

    /* Stock movement colours */
    .branch-dead {
      background-color: #ffe5e5;
    }

    .branch-slow {
      background-color: #fff8cc;
    }

    .branch-medium {
      background-color: #ffe8cc;
    }

    .branch-fast {
      background-color: #e3f6e3;
    }

    .branch-no-sales {
      background-color: #f2f2f2;
    }

    .movement-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-dead {
      background: #ffcccc;
      color: #b00000;
    }

    .badge-slow {
      background: #fff0a8;
      color: #7a6200;
    }

    .badge-medium {
      background: #ffd9ad;
      color: #9a4d00;
    }

    .badge-fast {
      background: #cceccc;
      color: #176b17;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>JCB Stock Finder</h1>

    <div class="search-box">

      <input
        type="text"
        id="partNumber"
        placeholder="Enter Part Number"
      >

      <button onclick="searchPart()">
        SEARCH STOCK
      </button>

    </div>

    <div id="result"></div>

  </div>

  <script>

    const SUPABASE_URL = "https://vqcsxozodlduvzwqumoz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_w8FhItbY8LzQdwXfK74hAQ_eO2mYDaY";

    async function searchPart() {

      const part = document
        .getElementById("partNumber")
        .value
        .trim();

      const result = document.getElementById("result");

      if (!part) {
        alert("Please enter a part number");
        return;
      }

      result.innerHTML =
        "<div class='result'>Searching...</div>";

      try {

        // STEP 1: Check whether the part exists in Price Master
        const masterUrl =
          SUPABASE_URL +
          "/rest/v1/part_master?Itemcode=ilike." +
          encodeURIComponent(part) +
          "&select=Itemcode,ItemName,MRP";

        const masterResponse = await fetch(masterUrl, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!masterResponse.ok) {
          throw new Error(await masterResponse.text());
        }

        const masterData = await masterResponse.json();

        // PART NUMBER DOES NOT EXIST
        if (masterData.length === 0) {

          await fetch(SUPABASE_URL + "/rest/v1/search_history", {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              part_number: part,
              search_status: "INCORRECT PART NO"
            })
          });

          result.innerHTML =
            "<div class='result'>" +
            "<h2>Incorrect Part No</h2>" +
            "<p><b>" + part + "</b> is not available in the Price Master.</p>" +
            "</div>";

          return;
        }

        // Use the exact master record
        const masterPart = masterData[0];

        // STEP 2: Find stock for this valid part
        const stockUrl =
          SUPABASE_URL +
          "/rest/v1/branch_stock?Itemcode=ilike." +
          encodeURIComponent(masterPart.Itemcode) +
          "&select=Itemcode,ItemName,Branch,quantity,Location";

        const stockResponse = await fetch(stockUrl, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!stockResponse.ok) {
          throw new Error(await stockResponse.text());
        }

        const data = await stockResponse.json();

        let total = 0;

        data.forEach(row => {
          total += Number(row.quantity) || 0;
        });

        // VALID PART BUT NO STOCK
        if (total <= 0) {

          await fetch(SUPABASE_URL + "/rest/v1/search_history", {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              part_number: part,
              search_status: "NO STOCK"
            })
          });

          result.innerHTML =
            "<div class='result'>" +
            "<h2>" + masterPart.Itemcode + "</h2>" +
            "<p><b>" + masterPart.ItemName + "</b></p>" +
            "<div class='total'>" +
            "<span>TOTAL STOCK: 0</span>" +
            "<span>MRP: ₹" +
            Number(masterPart.MRP || 0).toLocaleString("en-IN") +
            "</span>" +
            "</div>" +
            "<p><b>NO STOCK AVAILABLE IN ANY BRANCH</b></p>" +
            "</div>";

          return;
        }

        // STOCK AVAILABLE
        await fetch(SUPABASE_URL + "/rest/v1/search_history", {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            part_number: part,
            search_status: "FOUND"
          })
        });

        // STEP 3: Get 12-month movement status for each branch
        const movementUrl =
          SUPABASE_URL +
          "/rest/v1/stock_movement_analysis?Itemcode=eq." +
          encodeURIComponent(masterPart.Itemcode) +
          "&select=Itemcode,Branch,CurrentStock,SalesQty12M,MovementStatus";

        const movementResponse = await fetch(movementUrl, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!movementResponse.ok) {
          throw new Error(await movementResponse.text());
        }

        const movementData = await movementResponse.json();

        // Create branch -> movement status map
        const movementMap = {};

        movementData.forEach(row => {
          const branchKey = String(row.Branch || "")
            .trim()
            .toUpperCase();

          movementMap[branchKey] = {
            status: row.MovementStatus || "NO SALES",
            sales: Number(row.SalesQty12M) || 0
          };
        });

        // Create branch rows
        let rows = "";

        data.forEach(row => {

          const branchKey = String(row.Branch || "")
            .trim()
            .toUpperCase();

          const movement = movementMap[branchKey] || {
            status: "NO SALES",
            sales: 0
          };

          const status = movement.status;
          const sales = movement.sales;

          let rowClass = "branch-no-sales";
          let badgeClass = "";

          if (status === "DEAD STOCK") {
            rowClass = "branch-dead";
            badgeClass = "badge-dead";
          } else if (status === "SLOW MOVING") {
            rowClass = "branch-slow";
            badgeClass = "badge-slow";
          } else if (status === "MEDIUM MOVING") {
            rowClass = "branch-medium";
            badgeClass = "badge-medium";
          } else if (status === "FAST MOVING") {
            rowClass = "branch-fast";
            badgeClass = "badge-fast";
          }

          rows +=
            "<tr class='" + rowClass + "'>" +
            "<td><b>" + (row.Branch || "") + "</b></td>" +
            "<td>" + (row.quantity || 0) + "</td>" +
            "<td>" + (row.Location || "") + "</td>" +
            "<td>" + sales + "</td>" +
            "<td>" +
            "<span class='movement-badge " + badgeClass + "'>" +
            status +
            "</span>" +
            "</td>" +
            "</tr>";

        });

        result.innerHTML =
          "<div class='result'>" +
          "<h2>" + masterPart.Itemcode + "</h2>" +
          "<p><b>" + masterPart.ItemName + "</b></p>" +
          "<div class='total'>" +
          "<span>TOTAL STOCK: " + total + "</span>" +
          "<span>MRP: ₹" +
          Number(masterPart.MRP || 0).toLocaleString("en-IN") +
          "</span>" +
          "</div>" +

          "<div style='margin-bottom:20px; font-size:13px;'>" +
          "<b>Movement:</b> " +
          "<span style='background:#ffcccc;padding:5px 8px;border-radius:5px;margin-left:5px;'>DEAD</span>" +
          "<span style='background:#fff0a8;padding:5px 8px;border-radius:5px;margin-left:5px;'>SLOW</span>" +
          "<span style='background:#ffd9ad;padding:5px 8px;border-radius:5px;margin-left:5px;'>MEDIUM</span>" +
          "<span style='background:#cceccc;padding:5px 8px;border-radius:5px;margin-left:5px;'>FAST</span>" +
          "</div>" +

          "<table>" +
          "<tr>" +
          "<th>Branch</th>" +
          "<th>Stock</th>" +
          "<th>Location</th>" +
          "<th>12M Sales</th>" +
          "<th>Movement</th>" +
          "</tr>" +
          rows +
          "</table>" +
          "</div>";

      } catch (error) {

        result.innerHTML =
          "<div class='result error'>" +
          "<h2>Error</h2>" +
          "<p>" + error.message + "</p>" +
          "</div>";

      }

    }

  </script>

</body>
</html>
