<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krishna parts</title>
<link rel="icon" type="image/png" href="./ChatGPT%20Image%20Sep%2015,%202026,%2012_14_03%20PM.png">
<link rel="apple-touch-icon" href="./ChatGPT%20Image%20Sep%2015,%202026,%2012_14_03%20PM.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .search-box,
    .result {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

   .total {
  font-size: 20px;
  font-weight: bold;
  margin: 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 8px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      font-weight: bold;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>JCB Stock Finder</h1>

    <div class="search-box">

      <input
        type="text"
        id="partNumber"
        placeholder="Enter Part Number"
      >

      <button onclick="searchPart()">
        SEARCH STOCK
      </button>

    </div>

    <div id="result"></div>

  </div>

  <script>

   const SUPABASE_URL = "https://vqcsxozodlduvzwqumoz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_w8FhItbY8LzQdwXfK74hAQ_eO2mYDaY";

    async function searchPart() {

  const part = document
    .getElementById("partNumber")
    .value
    .trim();

  const result = document.getElementById("result");

  if (!part) {
    alert("Please enter a part number");
    return;
  }

  result.innerHTML =
    "<div class='result'>Searching...</div>";

  try {

    // STEP 1: Check whether the part exists in Price Master
    const masterUrl =
      SUPABASE_URL +
      "/rest/v1/part_master?Itemcode=ilike." +
      encodeURIComponent(part) +
      "&select=Itemcode,ItemName,MRP";

    const masterResponse = await fetch(masterUrl, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!masterResponse.ok) {
      throw new Error(await masterResponse.text());
    }

    const masterData = await masterResponse.json();

    // PART NUMBER DOES NOT EXIST
    if (masterData.length === 0) {

      await fetch(SUPABASE_URL + "/rest/v1/search_history", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          part_number: part,
          search_status: "INCORRECT PART NO"
        })
      });

      result.innerHTML =
        "<div class='result'>" +
        "<h2>Incorrect Part No</h2>" +
        "<p><b>" + part + "</b> is not available in the Price Master.</p>" +
        "</div>";

      return;
    }

    // Use the exact master record
    const masterPart = masterData[0];

    // STEP 2: Find stock for this valid part
    const stockUrl =
      SUPABASE_URL +
      "/rest/v1/branch_stock?Itemcode=ilike." +
      encodeURIComponent(masterPart.Itemcode) +
      "&select=Itemcode,ItemName,Branch,quantity,Location";

    const stockResponse = await fetch(stockUrl, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!stockResponse.ok) {
      throw new Error(await stockResponse.text());
    }

    const data = await stockResponse.json();

    let total = 0;

    data.forEach(row => {
      total += Number(row.quantity) || 0;
    });

    // VALID PART BUT NO STOCK
    if (total <= 0) {

      await fetch(SUPABASE_URL + "/rest/v1/search_history", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          part_number: part,
          search_status: "NO STOCK"
        })
      });

      result.innerHTML =
        "<div class='result'>" +

        "<h2>" + masterPart.Itemcode + "</h2>" +

        "<p><b>" +
        masterPart.ItemName +
        "</b></p>" +

        "<div class='total'>" +
        "<span>TOTAL STOCK: 0</span>" +
        "<span>MRP: ₹" +
        Number(masterPart.MRP || 0).toLocaleString("en-IN") +
        "</span>" +
        "</div>" +

        "<p><b>NO STOCK AVAILABLE IN ANY BRANCH</b></p>" +

        "</div>";

      return;
    }

    // STOCK AVAILABLE
    await fetch(SUPABASE_URL + "/rest/v1/search_history", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        part_number: part,
        search_status: "FOUND"
      })
    });

    let rows = "";

    data.forEach(row => {

      rows +=
        "<tr>" +
        "<td>" + row.Branch + "</td>" +
        "<td>" + row.quantity + "</td>" +
        "<td>" + (row.Location || "") + "</td>" +
        "</tr>";

    });

    result.innerHTML =
      "<div class='result'>" +

      "<h2>" + masterPart.Itemcode + "</h2>" +

      "<p><b>" +
      masterPart.ItemName +
      "</b></p>" +

      "<div class='total'>" +
      "<span>TOTAL STOCK: " + total + "</span>" +
      "<span>MRP: ₹" +
      Number(masterPart.MRP || 0).toLocaleString("en-IN") +
      "</span>" +
      "</div>" +

      "<table>" +

      "<tr>" +
      "<th>Branch</th>" +
      "<th>Stock</th>" +
      "<th>Location</th>" +
      "</tr>" +

      rows +

      "</table>" +

      "</div>";

  } catch (error) {

    result.innerHTML =
      "<div class='result error'>" +
      "<h2>Error</h2>" +
      "<p>" +
      error.message +
      "</p>" +
      "</div>";

  }

}  </script>

</body>
</html>
